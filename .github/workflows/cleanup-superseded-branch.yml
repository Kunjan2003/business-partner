name: Remove superseded auth branch
on:
  push:
    branches:
      - feature/high-priority-platform
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete closed-PR branch only if unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/verified-auth-onboarding"
          expected="aa6af010925a42f14eb54fe478e4fe3087b0874d"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [ "$actual" != "$expected" ]; then
            echo "Branch changed since consolidation; refusing to delete."
            exit 1
          fi
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.state')"
          new_base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/2" --jq '.base.ref')"
          if [ "$pr_state" != "closed" ] || [ "$new_base" != "main" ]; then
            echo "PR prerequisites are not met; refusing to delete."
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Removed obsolete authentication branch."
