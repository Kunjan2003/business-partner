name: Prepare priority integration dependencies
on:
  push:
    branches:
      - feature/high-priority-platform
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'chore(deps): install priority integrations')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install compatible Expo packages
        run: |
          cd apps/mobile
          npx expo install expo-notifications expo-device expo-constants expo-video @sentry/react-native --npm
      - name: Install Next.js Sentry
        run: npm install @sentry/nextjs -w @bp/web
      - name: Format all changes
        run: npx prettier --write .
      - name: Commit generated package lock and formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages docs supabase package-lock.json .github
          git commit -m "chore(deps): install priority integrations"
          git push origin HEAD:feature/high-priority-platform
